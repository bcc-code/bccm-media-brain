name: mediabrain

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mediabrain
      POSTGRES_PASSWORD: mediabrain
      POSTGRES_DB: mediabrain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediabrain -d mediabrain"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
