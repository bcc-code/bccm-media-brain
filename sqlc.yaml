version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: {import: time, type: Time, pointer: true}
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type: {import: time, type: Time, pointer: true}
          - db_type: jsonb
            go_type: {import: encoding/json, type: RawMessage}
          - db_type: jsonb
            nullable: true
            go_type: {import: encoding/json, type: RawMessage}
