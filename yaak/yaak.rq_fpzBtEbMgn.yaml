body:
  query: |
    mutation($in: RegisterFileInput!) {
      registerFile(input: $in) { id sizeBytes hashes { algo value } copies { id path status } }
    }
  variables: |-
    {
      "in": {
        "sizeBytes": 1073741824,
        "mimeType": "video/quicktime",
        "durationMs": 95000,
        "codec": "prores",
        "width": 1920,
        "height": 1080,
        "probe": {
          "format": {
            "format_name": "mov"
          }
        },
        "hashes": [
          {
            "algo": "XXH3_128",
            "value": "0123456789abcdef0123456789abcdef"
          }
        ],
        "copies": [
          {
            "locationId": "${[ location_id ]}",
            "path": "JOSH/S01/E03/A001_C003.mov"
          }
        ]
      }
    }
bodyType: graphql
description: 'Content is identified by its hashes: registering a known hash returns the existing file and adds new hashes and copies. Put the returned id into file_id.'
