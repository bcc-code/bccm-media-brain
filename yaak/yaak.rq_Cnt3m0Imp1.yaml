body:
  query: |
    mutation($in: CantemoImportInput!) {
      importFromCantemo(input: $in) {
        id title legacyIds metadata
        versions { label renditions { kind files { role file { sizeBytes codec hashes { algo value } copies { path location { name baseUri } } } } } }
      }
    }
  variables: |-
    {
      "in": {
        "itemId": "${[ cantemo_item_id ]}",
        "typeId": 1,
        "projectId": "${[ project_id ]}"
      }
    }
bodyType: graphql
description: Needs CANTEMO_URL, CANTEMO_USERNAME and CANTEMO_PASSWORD on the server. An item can be imported once. Leave projectId out to keep the asset visible to administrators only. Put the returned id into asset_id.
